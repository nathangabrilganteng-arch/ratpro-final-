name: Compile EXE
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Compile
        run: g++ worm.cpp -o worm.exe -lwininet -static -mwindows
      - uses: actions/upload-artifact@v4
        with:
          name: worm-exe
          path: worm.exe